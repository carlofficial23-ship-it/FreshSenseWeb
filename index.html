<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Fresh Sense</title>


<style>

* {
  box-sizing: border-box;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
}


body {

  margin: 0;

  background:
    #eef7f4;

  color:
    #16352e;

  padding:
    16px;

  display:
    flex;

  justify-content:
    center;
}


.app {

  width:
    100%;

  max-width:
    430px;
}


.header {

  text-align:
    center;

  padding:
    20px;
}


.header h1 {

  margin:
    0;

  font-size:
    34px;
}


.header p {

  color:
    #657a74;
}


.connection {

  padding:
    14px;

  text-align:
    center;

  border-radius:
    15px;

  font-weight:
    bold;

  margin-bottom:
    14px;
}


.disconnected {

  background:
    #ffe4e4;

  color:
    #992020;
}


.connected {

  background:
    #dcf6e5;

  color:
    #14713a;
}


.card {

  background:
    white;

  border-radius:
    18px;

  padding:
    17px;

  margin-bottom:
    13px;
}


.label {

  font-size:
    11px;

  text-transform:
    uppercase;

  letter-spacing:
    1px;

  color:
    #71837e;
}


.value {

  font-size:
    22px;

  font-weight:
    bold;

  margin-top:
    6px;
}


.grid {

  display:
    grid;

  grid-template-columns:
    1fr 1fr;

  gap:
    10px;

  margin-bottom:
    13px;
}


.sensor {

  background:
    white;

  border-radius:
    17px;

  padding:
    15px 8px;

  text-align:
    center;
}


.sensorValue {

  font-size:
    22px;

  font-weight:
    bold;

  margin-top:
    6px;
}


.progressOuter {

  height:
    12px;

  background:
    #e1e9e6;

  border-radius:
    10px;

  overflow:
    hidden;

  margin-top:
    14px;
}


#progressBar {

  width:
    0%;

  height:
    100%;

  background:
    #176b59;

  transition:
    width 0.3s;
}


.resultCard {

  text-align:
    center;
}


.fresh {

  background:
    #dcf6e5;

  color:
    #126a38;
}


.warning {

  background:
    #ffe1e1;

  color:
    #9b2020;
}


.scanning {

  background:
    #fff3cc;
}


button {

  width:
    100%;

  border:
    none;

  border-radius:
    14px;

  padding:
    15px;

  margin-bottom:
    10px;

  font-size:
    16px;

  font-weight:
    bold;
}


#connectButton {

  background:
    #146b59;

  color:
    white;
}


#voiceButton {

  background:
    #dfece8;

  color:
    #164f43;
}


#firebaseStatus {

  text-align:
    center;

  margin:
    12px;

  font-size:
    13px;
}


.debug {

  text-align:
    center;

  font-size:
    11px;

  color:
    #71837e;

  word-break:
    break-word;
}

</style>

</head>


<body>


<div class="app">


<div class="header">

  <h1>
    Fresh Sense
  </h1>

  <p>
    Sense the Gas, Skip the Waste
  </p>

</div>


<div
  id="connectionStatus"
  class="connection disconnected"
>

  Bluetooth Disconnected

</div>


<div class="card">

  <div class="label">
    Selected Food
  </div>

  <div
    id="food"
    class="value"
  >
    ---
  </div>

</div>


<div class="card">

  <div class="label">
    Device Status
  </div>

  <div
    id="status"
    class="value"
  >
    Waiting
  </div>

</div>


<div class="card">

  <div class="label">
    Scan Progress
  </div>

  <div
    id="scanPhase"
    class="value"
  >
    Waiting
  </div>


  <div class="progressOuter">

    <div id="progressBar">
    </div>

  </div>


  <p id="scanCount">
    0 / 5
  </p>

</div>


<div class="grid">


<div class="sensor">

  <div class="label">
    BME680
  </div>

  <div
    id="bmeValue"
    class="sensorValue"
  >
    --
  </div>

  kΩ

</div>


<div class="sensor">

  <div class="label">
    MQ-137
  </div>

  <div
    id="mqValue"
    class="sensorValue"
  >
    --
  </div>

  V

</div>


<div class="sensor">

  <div class="label">
    Temperature
  </div>

  <div
    id="tempValue"
    class="sensorValue"
  >
    --
  </div>

  °C

</div>


<div class="sensor">

  <div class="label">
    Humidity
  </div>

  <div
    id="humidityValue"
    class="sensorValue"
  >
    --
  </div>

  %

</div>


</div>


<div
  id="resultCard"
  class="card resultCard"
>

  <div class="label">
    Freshness Assessment
  </div>


  <div
    id="result"
    class="value"
  >

    No Result

  </div>


  <p id="resultDescription">

    Complete a scan.

  </p>

</div>


<div id="firebaseStatus">

  Firebase: Waiting

</div>


<button id="connectButton">

  Connect Fresh Sense

</button>


<button id="voiceButton">

  Enable Voice

</button>


<div class="debug">

  Last BLE message:

  <br>

  <span id="lastMessage">

    ---

  </span>

</div>


</div>


<script>

// =====================================================
// FIREBASE
// =====================================================

const FIREBASE_URL =
"https://fresh-sense-bead3-default-rtdb.asia-southeast1.firebasedatabase.app";


// =====================================================
// BLE
// =====================================================

const SERVICE_UUID =
"12345678-1234-1234-1234-123456789abc";


const CHARACTERISTIC_UUID =
"87654321-4321-4321-4321-cba987654321";


let device =
  null;


let characteristic =
  null;


let voiceEnabled =
  false;


// =====================================================
// SESSION
// =====================================================

function newSession() {

  return {

    foodType:
      null,

    baseline:
      [],

    food:
      [],

    result:
      null,

    uploaded:
      false,

    startedAt:
      new Date()
      .toISOString()

  };
}


let session =
  newSession();


// =====================================================
// ELEMENTS
// =====================================================

const connectionStatus =
document.getElementById(
  "connectionStatus"
);


const foodLabel =
document.getElementById(
  "food"
);


const statusLabel =
document.getElementById(
  "status"
);


const scanPhase =
document.getElementById(
  "scanPhase"
);


const scanCount =
document.getElementById(
  "scanCount"
);


const progressBar =
document.getElementById(
  "progressBar"
);


const bmeValue =
document.getElementById(
  "bmeValue"
);


const mqValue =
document.getElementById(
  "mqValue"
);


const tempValue =
document.getElementById(
  "tempValue"
);


const humidityValue =
document.getElementById(
  "humidityValue"
);


const resultCard =
document.getElementById(
  "resultCard"
);


const resultLabel =
document.getElementById(
  "result"
);


const resultDescription =
document.getElementById(
  "resultDescription"
);


const firebaseStatus =
document.getElementById(
  "firebaseStatus"
);


const lastMessage =
document.getElementById(
  "lastMessage"
);


// =====================================================
// VOICE
// =====================================================

function speak(
  text
) {

  if (
    !voiceEnabled
  ) {

    return;
  }


  if (
    !window.speechSynthesis
  ) {

    return;
  }


  speechSynthesis.cancel();


  const speech =

    new SpeechSynthesisUtterance(
      text
    );


  speech.lang =
    "en-US";


  speech.rate =
    0.90;


  speechSynthesis.speak(
    speech
  );
}


document
.getElementById(
  "voiceButton"
)
.onclick =
function() {

  voiceEnabled =
    true;


  this.innerText =
    "Voice Enabled ✓";


  speak(
    "Fresh Sense voice enabled."
  );
};


// =====================================================
// CONNECT
// =====================================================

document
.getElementById(
  "connectButton"
)
.onclick =
connectFreshSense;


async function connectFreshSense() {

  try {

    if (
      !navigator.bluetooth
    ) {

      alert(
        "Please open Fresh Sense using Bluefy."
      );

      return;
    }


    device =

      await navigator.bluetooth
      .requestDevice({

        acceptAllDevices:
          true,

        optionalServices: [
          SERVICE_UUID
        ]

      });


    device.addEventListener(

      "gattserverdisconnected",

      function() {

        connectionStatus.innerText =
          "Bluetooth Disconnected";


        connectionStatus.className =
          "connection disconnected";


        statusLabel.innerText =
          "Disconnected";

      }

    );


    const server =

      await device.gatt
      .connect();


    const service =

      await server
      .getPrimaryService(
        SERVICE_UUID
      );


    characteristic =

      await service
      .getCharacteristic(
        CHARACTERISTIC_UUID
      );


    await characteristic
      .startNotifications();


    characteristic
      .addEventListener(

        "characteristicvaluechanged",

        event => {

          const message =

            new TextDecoder()
            .decode(
              event.target.value
            )
            .trim();


          processMessage(
            message
          );

        }

      );


    connectionStatus.innerText =
      "Fresh Sense Connected";


    connectionStatus.className =
      "connection connected";


    statusLabel.innerText =
      "Device Ready";


    document
    .getElementById(
      "connectButton"
    )
    .innerText =
      "Connected ✓";

  }


  catch(error) {

    console.error(
      error
    );


    alert(
      "Bluetooth error: "
      +
      error.message
    );
  }
}


// =====================================================
// PROCESS BLE MESSAGE
// =====================================================

function processMessage(
  message
) {

  console.log(
    "BLE:",
    message
  );


  lastMessage.innerText =
    message;


  // =================================================
  // SENSOR TELEMETRY
  // =====================================================

  if (
    message.startsWith(
      "SCAN|"
    )
  ) {

    const p =
      message.split("|");


    if (
      p.length < 7
    ) {

      return;
    }


    const phase =
      p[1];


    const number =
      Number(
        p[2]
      );


    const reading = {

      scan:
        number,

      bmeGas_kOhm:
        Number(
          p[3]
        ),

      mqAO_V:
        Number(
          p[4]
        ),

      temperature:
        Number(
          p[5]
        ),

      humidity:
        Number(
          p[6]
        )

    };


    if (
      phase ===
      "BASELINE"
    ) {

      session.baseline[
        number - 1
      ] =
        reading;


      scanPhase.innerText =
        "Baseline Scan";


      statusLabel.innerText =
        "Measuring empty container";
    }


    else if (
      phase ===
      "FOOD"
    ) {

      session.food[
        number - 1
      ] =
        reading;


      scanPhase.innerText =
        "Food Scan";


      statusLabel.innerText =
        "Measuring food";
    }


    scanCount.innerText =

      number
      +
      " / 5";


    progressBar.style.width =

      (
        number *
        20
      )

      +
      "%";


    bmeValue.innerText =
      reading.bmeGas_kOhm;


    mqValue.innerText =
      reading.mqAO_V;


    tempValue.innerText =
      reading.temperature;


    humidityValue.innerText =
      reading.humidity;


    resultCard.className =
      "card resultCard scanning";


    return;
  }


  // =================================================
  // FOOD SELECT
  // =====================================================

  if (
    message ===
    "FOOD_SELECTED:chicken"
  ) {

    session =
      newSession();


    session.foodType =
      "chicken";


    foodLabel.innerText =
      "Chicken";


    resetDisplay();


    return;
  }


  if (
    message ===
    "FOOD_SELECTED:bread"
  ) {

    session =
      newSession();


    session.foodType =
      "bread";


    foodLabel.innerText =
      "Bread";


    resetDisplay();


    return;
  }


  // =================================================
  // BASELINE
  // =====================================================

  if (
    message ===
    "BASELINE_STARTED"
  ) {

    statusLabel.innerText =
      "Measuring empty container";


    scanPhase.innerText =
      "Baseline Scan";


    return;
  }


  if (
    message ===
    "BASELINE_COMPLETE"
  ) {

    statusLabel.innerText =
      "Insert food";


    speak(
      "Baseline complete. Please insert the food sample."
    );


    return;
  }


  // =================================================
  // FOOD SCAN
  // =====================================================

  if (
    message ===
    "FOOD_SCAN_STARTED"
  ) {

    statusLabel.innerText =
      "Measuring food";


    scanPhase.innerText =
      "Food Scan";


    progressBar.style.width =
      "0%";


    scanCount.innerText =
      "0 / 5";


    return;
  }


  // =================================================
  // ANALYSIS
  // =====================================================

  if (
    message ===
    "ANALYZING"
  ) {

    statusLabel.innerText =
      "Analyzing";


    return;
  }


  // =================================================
  // FRESH
  // =====================================================

  if (
    message ===
    "FRESH"
  ) {

    session.result =
      "FRESH";


    resultCard.className =
      "card resultCard fresh";


    resultLabel.innerText =
      "FRESH";


    resultDescription.innerText =
      "Sensor pattern is closer to the prototype fresh reference.";


    statusLabel.innerText =
      "Scan Complete";


    speak(
      "Fresh Sense detected a fresh like sensor pattern."
    );


    uploadFirebase();


    return;
  }


  // =================================================
  // HIGH RESPONSE
  // =====================================================

  if (
    message ===
    "HIGH_SPOILAGE_RESPONSE"
  ) {

    session.result =
      "HIGH_SPOILAGE_RESPONSE";


    resultCard.className =
      "card resultCard warning";


    resultLabel.innerText =
      "HIGH SPOILAGE RESPONSE";


    resultDescription.innerText =
      "Sensor pattern is closer to the prototype high spoilage reference.";


    statusLabel.innerText =
      "Scan Complete";


    speak(
      "Warning. Fresh Sense detected a high spoilage response."
    );


    uploadFirebase();


    return;
  }


  if (
    message ===
    "SENSOR_ERROR"
  ) {

    resultCard.className =
      "card resultCard warning";


    resultLabel.innerText =
      "SENSOR ERROR";


    statusLabel.innerText =
      "Please repeat scan";


    return;
  }


  if (
    message ===
    "NEW_TEST"
  ) {

    session =
      newSession();


    resetDisplay();


    foodLabel.innerText =
      "---";


    statusLabel.innerText =
      "Select Food";


    return;
  }
}


// =====================================================
// AVERAGE
// =====================================================

function average(
  list,
  key
) {

  const valid =
    list.filter(
      Boolean
    );


  if (
    valid.length ===
    0
  ) {

    return 0;
  }


  return valid.reduce(

    (
      sum,
      item
    ) =>

      sum
      +
      Number(
        item[key]
      ),

    0

  )

  /

  valid.length;
}


// =====================================================
// SUMMARY
// =====================================================

function makeSummary() {

  const baseBME =
    average(
      session.baseline,
      "bmeGas_kOhm"
    );


  const foodBME =
    average(
      session.food,
      "bmeGas_kOhm"
    );


  const baseMQ =
    average(
      session.baseline,
      "mqAO_V"
    );


  const foodMQ =
    average(
      session.food,
      "mqAO_V"
    );


  const baseTemp =
    average(
      session.baseline,
      "temperature"
    );


  const foodTemp =
    average(
      session.food,
      "temperature"
    );


  const baseHumidity =
    average(
      session.baseline,
      "humidity"
    );


  const foodHumidity =
    average(
      session.food,
      "humidity"
    );


  const bmePercentChange =

    baseBME !== 0

    ?

    (
      (
        foodBME -
        baseBME
      )

      /

      baseBME

      *
      100
    )

    :

    0;


  const mqPercentChange =

    baseMQ !== 0

    ?

    (
      (
        foodMQ -
        baseMQ
      )

      /

      baseMQ

      *
      100
    )

    :

    0;


  return {

    baselineBME:
      Number(
        baseBME.toFixed(2)
      ),


    foodBME:
      Number(
        foodBME.toFixed(2)
      ),


    bmePercentChange:
      Number(
        bmePercentChange.toFixed(2)
      ),


    baselineMQ:
      Number(
        baseMQ.toFixed(3)
      ),


    foodMQ:
      Number(
        foodMQ.toFixed(3)
      ),


    mqPercentChange:
      Number(
        mqPercentChange.toFixed(2)
      ),


    baselineTemp:
      Number(
        baseTemp.toFixed(2)
      ),


    foodTemp:
      Number(
        foodTemp.toFixed(2)
      ),


    baselineHumidity:
      Number(
        baseHumidity.toFixed(2)
      ),


    foodHumidity:
      Number(
        foodHumidity.toFixed(2)
      )

  };
}


// =====================================================
// FIREBASE UPLOAD
// =====================================================

async function uploadFirebase() {

  if (
    session.uploaded
  ) {

    return;
  }


  if (
    !session.foodType ||
    !session.result
  ) {

    firebaseStatus.innerText =
      "Firebase: Missing food/result";

    return;
  }


  const baselineCount =
    session.baseline
    .filter(Boolean)
    .length;


  const foodCount =
    session.food
    .filter(Boolean)
    .length;


  if (
    baselineCount !== 5 ||
    foodCount !== 5
  ) {

    firebaseStatus.innerText =

      "Firebase: Incomplete scan data "
      +
      baselineCount
      +
      "/5 + "
      +
      foodCount
      +
      "/5";


    return;
  }


  firebaseStatus.innerText =
    "Firebase: Uploading...";


  const record = {

    foodType:
      session.foodType,


    result:
      session.result,


    createdAt: {
      ".sv":
        "timestamp"
    },


    source:
      "Fresh Sense Bluefy Web App",


    scanIntervalSeconds:
      15,


    baseline:
      session.baseline,


    food:
      session.food,


    summary:
      makeSummary(),


    aiStatus:
      "pending",


    emailStatus:
      "pending",


    retryCount:
      0

  };


  const url =

    FIREBASE_URL

    +

    "/FreshSense/ClassificationTests/"

    +

    session.foodType

    +

    ".json";


  try {

    const response =

      await fetch(

        url,

        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify(
              record
            )

        }

      );


    if (
      !response.ok
    ) {

      throw new Error(

        "HTTP "
        +
        response.status

      );
    }


    const data =
      await response.json();


    session.uploaded =
      true;


    firebaseStatus.innerText =
      "Firebase Saved ✓";


    console.log(

      "Firebase record ID:",

      data.name

    );

  }


  catch(error) {

    console.error(
      error
    );


    firebaseStatus.innerText =

      "Firebase Failed: "

      +

      error.message;

  }
}


// =====================================================
// RESET
// =====================================================

function resetDisplay() {

  scanPhase.innerText =
    "Waiting";


  scanCount.innerText =
    "0 / 5";


  progressBar.style.width =
    "0%";


  bmeValue.innerText =
    "--";


  mqValue.innerText =
    "--";


  tempValue.innerText =
    "--";


  humidityValue.innerText =
    "--";


  resultCard.className =
    "card resultCard";


  resultLabel.innerText =
    "Waiting";


  resultDescription.innerText =
    "Complete a scan.";


  firebaseStatus.innerText =
    "Firebase: Waiting";
}

</script>


</body>

</html>
